# rubric-manual-dimensions.yaml — G3 手寫維度(script 梯度無法產出者)
# 來源:G3 裁決 Q3/Q4/Q6;證據=research/qualitative_notes/*(54 份 3b 筆記)
# 與 rubric-draft.yaml(script 自動)合併為最終 research/rubric.yaml
# 措辭紀律(G3 發現 D):script differentiator 的 ρ(log_stars) 僅 0.19–0.32,一律稱「剖面關聯」非「梯度驅動」

# ============ A. hygiene 門檻(來源 triangulation,非本樣本 prevalence,G3-Q4)============
# 樣本以合規 SKILL.md 篩選,使多數 hygiene 特徵推到天花板或推出樣本;此組門檻改由
# 官方規範(anthropics/skills + agentskills.io spec + skill-creator)三角驗證得出,不計分、不過即 fail。
rubric_version: "2.0.0"   # 與 rubric.yaml 同步遞增(兩份合起來才是完整 rubric)
# ↑ 1.0.0 = G3 定稿(2026-08-16);1.1.0 = round 2 的 7 個例外欄位落地(2026-08-17);
#   2.0.0 = L-004 依一致性量測改寫(新增 decision_order 與 collection_aggregation、
#           exemption 判準由列舉改為單一提問)。major 因為判定結果會改變。
hygiene:
  - id: H-001
    dimension: spec_compliance
    check_type: script
    source: triangulation            # 非 tier_prevalence(樣本內 100% 為 selection artifact)
    rule: "存在 ≥1 個含合規 frontmatter(非空 name + 非空 description)的 SKILL.md"
    pass_criteria: "skill_md_compliant_count ≥ 1"
    severity: error
    mechanism: "走官方規格,harness 才能被動載入 metadata、觸發與相容性可預期"
  - id: H-002
    dimension: trigger_design
    check_type: script
    source: triangulation
    rule: "description 存在且非佔位文字"
    pass_criteria: "fm_description_pct 100% 且非官方 template 佔位語"
    severity: error
    mechanism: "無 description 則 model-invocation 無法觸發,skill 形同不存在"
  - id: H-003
    dimension: progressive_disclosure
    check_type: script
    source: triangulation
    rule: "SKILL.md 正文未過度膨脹(官方建議 <500 行),細節下放 references/"
    pass_criteria: "skill_md_max_lines < 500 或有 references/ 分層"
    severity: warning
    mechanism: "三層載入(metadata→body→references)控制 context 成本"
    caveat: "本研究反證:jezweb CLAUDE.md 主張『800 行勝過 300 行』,長度非絕對;故列 warning 非 error"
  - id: H-005
    dimension: spec_compliance
    check_type: script
    source: triangulation            # 同 H-001:官方規格要求每個 skill 都要有合規 frontmatter
    rule: "SKILL.md **逐檔**合規(關閉 H-001 只問 repo 級『≥1 合規』的盲點)"
    pass_criteria: "noncompliant_skills 為空"
    severity: warning                # repo-wide 情境;change-scoped 見下
    change_scoped_severity: |
      **error**——當呼叫端能取得「本次變更檔案」時(如 ASP G5)。
      **實作上由 `lint_skill.py --changed-files` 一次決定 severity,呼叫端只消費結果、
      不得自行重算交集**(ADR-031:同一意義兩處編碼會 drift;本 rubric 是 canonical)。
      為何分兩種嚴重度:repo-wide 一律擋會「因既有爛攤子擋住無關的改動」;
      change-scoped 才精準命中「你這次改壞了」——這正是 H-001 抓不到的情境
      (已有 10 個好 skill 的 repo 新增第 11 個壞的,H-001 仍 pass)。
    empirical_false_positive_rate: |
      54 個 rubric 樣本實測:1 個命中(alirezarezvani/claude-skills,12 個 SKILL.md 缺
      name/description),其餘 53 個乾淨。誤報率低,warning 級安全。
      註:初版曾誤標 3 個,查出是 lint 的 naive parser 不認 YAML 隱式多行純量
      (`description:` 後直接換行接縮排)——已修,兩處 parser(lint 與 extract fallback)同步對齊。
    mechanism: "逐檔合規才能保證每個 skill 都被 harness 正確載入;repo 級聚合會讓壞檔藏在好檔後面"

  - id: H-004
    dimension: deterministic_offloading
    check_type: script
    source: gradient+triangulation   # 本樣本唯一存活的 hygiene(dir_scripts 各層 71–88%)
    rule: "重複/可驗證操作下放 scripts/"
    pass_criteria: "dir_scripts = true(適用於有確定性操作的 skill)"
    severity: info
    exemption: "純知識/參考型 skill(pct_markdown ≥85% 且 code_file_count ≤2 且無 scripts/)豁免,判 N/A 而非 fail(self-audit §4 條2)"
    mechanism: "降低 LLM 誤差與 token 成本"

# ============ B. LLM-only differentiator(craft,G3-Q3)============
# script 梯度顯示 craft 特徵(trigger/style/scope)量化落 noise,但 54 份質化筆記證據充分。
# 此組 check_type=llm,無 tier_prevalence;evidence_strength 來自跨 tier 質化觀察的一致性。
# 措辭:符合 X 星級「剖面」,不宣稱「梯度驅動」。
craft_llm:
  - id: L-001
    dimension: trigger_design
    check_type: llm
    signal_type: craft
    rule: "description 觸發語境具體且適度 pushy,非關鍵字轟炸、非過寬"
    pass_criteria: "含明確觸發情境(Use when/當…時);高分再具負向觸發(NOT for)且無 SEO 式關鍵字堆疊"
    disambiguation: |
      「關鍵字轟炸」判準不是片語數量,而是**語意是否重複**(self-audit r2 M3):
      - 扣分(同義詞灌水):多個片語指向同一意圖,純為擴大命中面(browser-act 20+ SEO 變體)
      - 不扣分(多子意圖映射):每個片語對應不同子問題、不同回應內容,是 domain-lookup 型
        skill 的正當設計(ga-methodology ~25 片語,各自映射到不同的「意圖→行動」列)
      判別法:抽 3 個片語,若它們在 body 觸發的是同一段內容 → 灌水;不同段 → 正當。
    evidence_strength: moderate
    evidence_refs: ["kangarooking(NOT-for 標竿)", "nicobailon(量化門檻)", "browser-act(20+ 變體轟炸=反例)", "Leonxlnx/taste(全無 Use when=反例)", "ga-methodology(多子意圖映射=不該扣分,self-audit r2)"]
    mechanism: "觸發語境具體 → 正確 undertrigger/overtrigger 平衡,skill 在對的時機被叫用"
    note: "對應 script 的 desc_has_trigger 為 noise(G3 發現 B):二元存在性抓不到品質,必須 LLM 判讀"
  - id: L-002
    dimension: writing_quality
    check_type: llm
    signal_type: craft
    rule: "imperative + 解釋 why 而非堆疊 MUST;附 Bad/Good 對照例或等價替代;含 override/例外節"
    pass_criteria: "規則附因果理由;有具體反例對照**或等價替代**(見 equivalent_forms);高分具『何時打破規則』段"
    equivalent_forms: |
      「具體反例對照」不限 prose Bad/Good pair,以下達成同等教學效果者等價計分
      (self-audit r2 M4):
      - **可證偽啟發式**:給一個能實際套用並得出二元結論的測試
        (improve-codebase-architecture 的 deletion test:「刪掉後複雜度消失=pass-through;
        在 N 個 caller 重現=它在做事」)
      - **結構化表格/門檻表**:用參數表、log 訊號表、決策矩陣承載同樣的「這樣做/不這樣做」
        (ga-methodology 的閾值表與替代優化器選擇指南——後者功能上即 override 節)
      - **精確術語表**:以定義消除歧義,取代靠例子示範(improve-codebase-architecture 的
        Module/Interface/Depth/Seam/Adapter 詞彙表)
    exemption: |
      **不得因簡潔扣分**(self-audit r2 M1/M2)。L-002 預設 skill 是「規則集」,
      但下列形狀沒有規則需要被解釋,判 N/A 而非 poor:
      - **canned-phrase 型**:本體是一句注入語(zoom-out)
      - **互動協定型**:只定義互動節奏、無領域規則(grill-me,11 行即完整)
      對這類 skill 要求 why/Bad-Good/override 等於**獎勵灌水**——逼作者發明不需要的散文。
      與 H-003 的「長度非絕對」caveat 同源,craft 維度適用同一原則。
    evidence_strength: moderate
    evidence_refs: ["ayghri/i-have-adhd(why→rules→override→自檢)", "blader/humanizer(33 pattern 皆附 why)", "Jeffallan(裸 MUST 堆疊=弱例)", "improve-codebase-architecture(deletion test=等價替代)", "grill-me/zoom-out(簡潔不扣分,self-audit r2)"]
    mechanism: "解釋 why 使 model 能在未列舉情境下正確類推,而非機械執行 checklist"
  - id: L-003
    dimension: scope_clarity
    check_type: llm
    signal_type: craft
    rule: "一個 skill 一個 job-to-be-done;集合/框架型具 skill 間路由治理"
    pass_criteria: "單一 skill 邊界乾淨;D/C 類具 dispatcher 或 When-to-Pivot 互相路由"
    sub_pattern_cross_skill: |
      **獨立 skill 之間的交叉引用亦計分**(self-audit r2 §5-1)。原證據庫只記錄了集合型 repo
      **內部**的 dispatcher,但獨立安裝的 skill 若彼此協作,同屬 scope 治理的高分樣態:
      - 以相對路徑複用他人 reference 而非複製(improve-codebase-architecture 引用
        `../grill-with-docs/CONTEXT-FORMAT.md`)——DRY 跨 skill
      - 顯式交棒逾越範圍的發現(diagnose 把架構問題交給 /improve-codebase-architecture,
        而非自行吸收)——這是「知道自己邊界在哪」的最強訊號
      機制:個人 skill 庫因此像一套系統而非雜物堆,skill 間不互搶、不重複維護。
    collection_sampling: |
      **集合型須以子 skill 抽樣評分**(self-audit r2 §5-3):只讀入口 SKILL.md 會系統性低估
      (huashu-nuwa 的品質訊號在 16 份子 skill 的一致模板,入口檔看不出來)。
      對應 G2-Q4 的 `phase3b_sample` 確定性抽樣設計。
    domain_lookup_scope: |
      **domain-lookup 型不因涵蓋多子題扣分**(r2 驗證輪補;原僅 dispatcher/集合型有此例外,
      驗證者被迫自行外推)。判準是**子題是否同屬一個 domain expertise**,而非子題數量:
      - 不扣分:ga-methodology 涵蓋族群設計/收斂診斷/消融/過擬合/適應度/優化器選型——
        全是「調校 GA」這一件事的不同切面,讀者為同一類人、在同一情境查閱
      - 扣分(真 scope creep):planning-with-files 在單一 skill 內長出 attestation、
        多 plan 並行、autonomous 模式、hooks——**不同 job 被塞進同一個 skill**
      判別法:問「這些子題會不會在同一次任務中被同一個人用到?」會 → 同一 domain;
      不會 → scope creep。
    evidence_strength: moderate
    evidence_refs: ["ljagiello/ctf-skills(When-to-Pivot 路由)", "addyosmani(生命週期切分+防重複規則)", "planning-with-files(單 skill 長成小產品=弱例)", "diagnose→improve-codebase-architecture(跨 skill 交棒,self-audit r2)"]
    mechanism: "scope 單一 → 觸發不重疊、維護不衝突;集合型靠路由治理避免 skill 互搶"
  - id: L-004
    dimension: writing_quality
    check_type: llm
    signal_type: craft
    rule: "anti-hallucination 機制(高階加分項)"
    pass_criteria: |
      含 dated verified snapshot / never-generate-from-memory / stale-API 名單等條款。
      **強弱有別(2026-08-17 加,R1 指出選言式壓縮品質差距)**:三種達標形式的強度不等,
      判 good 時應在 findings 註明是哪一種,不要讓「live probe + 結果判讀表」與
      「一條參考連結」看起來一樣:
        強 > 中 > 弱 = dated snapshot + 驗證協定 > never-from-memory 條款 > 單純來源標註
    decision_order: |
      **判定順序(2026-08-17 新增,務必照序;取代原本 good 與 n/a 各自獨立的兩條路徑)**

      1. **機制存在?**(有 pass_criteria 所述任一形式)→ **good**
         ——不論該 skill 有沒有易腐事實。主動寫反編造條款是真實的 craft,不該因「本來就沒東西會過時」
         而被抹掉成 n/a。
      2. 機制不存在,且**沒有**任何易腐內容(見 exemption 判準)→ **n/a**
      3. 機制不存在,但**有**易腐內容 → 依覆蓋率判 `mixed`(部分覆蓋)或 `poor`(幾乎無覆蓋)

      **為什麼要明訂**:一致性量測(2026-08-17,n=55)顯示 L-004 是四維中最不穩的一條
      (Fleiss κ=0.400,14 個分歧佔 8 個)。根因是原條文的 `pass_criteria`(有機制→good)
      與 `exemption`(無易腐事實→n/a)對「無易腐事實**且**有機制」的 skill 同時成立、給出不同答案。
      三位獨立審查者中有**兩位各自發明了完全相同的裁決規則**(即上面的 1→2→3),
      第三位判了 n/a,分歧正好出在該格(`obra/superpowers`)。本條把那個共識寫進 rubric。
    collection_aggregation: |
      **集合型 repo 的聚合規則(2026-08-17 新增,R2 指出原本缺這條)**:
      抽樣 ≤5 份時——good = 機制存在且覆蓋到易腐表面;mixed = 部分覆蓋或樣本間不一致;
      poor = 大量時效性宣稱而幾乎無機制。判定一律是對「抽樣所見」的判定,不是對整個 repo 的斷言。
      (原本沒有這條,審查者只能各自發明門檻,是 L-004 不穩的成因之一。)
    exemption: |
      **skill 未宣稱任何易腐內容時判 N/A,不計為缺項**(self-audit r2 M6;
      2026-08-17 依一致性量測擴大判準)。
      純流程、方法論、互動風格、穩定數學/演算法領域的 skill 沒有「會過時的事實」可標注時效——
      要求它們加 dated snapshot 是無物可指。
      證據:22 個自家內部 skill 中 18 個此項缺席,若無本條款會被系統性誤判為 18 個缺陷。
      比照 H-004 的 exemption 寫法。

      **判準(2026-08-17 改寫)**:原本列舉「API/版本/法規/市場數據」,實測顯示真實樣本
      大量落在列舉之外,審查者只能各自外推。改為單一提問:

      > **這份 skill 是否有任何一段內容,會因為「它無法控制的東西」改變而變錯?**

      是 → 有易腐內容,不適用 exemption。列舉只是例子,不是窮舉:
        - API / 版本號 / 法規 / 市場數據(原列舉)
        - **未附引用的科學或領域事實主張**(實例:某 skill 直述五條 ADHD 神經科學事實)
        - **對第三方工具的路徑、預設值、runtime 行為的斷言**(實例:斷言某 CLI 的 skill 安裝路徑)
        - **本地產物的結構描述**(實例:記錄自家 index.html 的 CSS class)——
          **算易腐**。雖然它不是「外部」事實,但 skill 無法控制那份產物何時被改;
          原條文只說「外部」,審查者無從判斷,此處明確裁定納入。
    evidence_strength: weak            # 跨 tier 觀察但僅高品質樣本具備,n 少
    evidence_refs: ["K-Dense", "Orchestra(ml-paper-writing)", "claude-ads", "google/skills", "huashu-nuwa 生態系(調研截止日+時效盲區+誠實邊界三件套可模板化,self-audit r2)"]
    mechanism: "明示事實來源與時效 → 降低 model 從訓練記憶編造,提升可信度與採用"

# ============ C. 安全維度(hygiene,不加分不過即 fail,BRIEF §8-8 例外)============
# 來源:3b 質化筆記實證紅旗;安全一律 hygiene(高低星皆可能不安全,不能拿來加分)
security:
  - id: S-001
    dimension: security
    check_type: hybrid
    source: qualitative+static
    rule: "無『服從外部程式輸出且抑制人工確認』的鏈式指令"
    pass_criteria: "不出現『安裝後照 binary 輸出逐字執行』+『don't stop for confirmation』組合"
    severity: error
    evidence_refs: ["NevaMind-AI/memU(install→服從輸出→抑制確認)"]
    mechanism: "此模式把指令來源移到 SKILL.md 外,靜態審查無法覆蓋實際被執行的指令,與 injection 載體同構"
  - id: S-002
    dimension: security
    check_type: script
    source: static
    rule: "hooks/常駐執行機制須顯式揭露"
    pass_criteria: "frontmatter 註冊 hook 事件時,README/SKILL 明示其常駐執行副作用"
    detection: "只認 .claude/hooks/ 或 hooks/ 下實際腳本、或 frontmatter 的 hook 事件鍵(PreToolUse 等);不掃內文 'hook' 字(self-audit §4 條3:先前誤中 React/GSAP hook)"
    severity: warning
    evidence_refs: ["OthmanAdi/planning-with-files(5 hook 事件搜路徑執行首個 shell script)"]
    mechanism: "hooks = 授予 repo 腳本常駐執行權,是 SKILL.md 格式攻擊面最大處"
  - id: S-003
    dimension: security
    check_type: hybrid
    rule: "無 harness/使用者層指令覆蓋、無憑證進 argv、自我更新須 HITL"
    pass_criteria: "不宣告覆蓋 harness 內建指令;API key 不進命令列參數;git pull 自我更新需人工確認"
    severity: warning
    evidence_refs: ["mvanhorn/last30days(覆蓋 WebSearch 指令)", "upload-to-stitch(key 進 --api-key argv)", "guizang-ppt(啟動即自我 git pull)"]
    mechanism: "三者皆擴大 agent 權限面或洩漏憑證,屬供應鏈/權限升級風險"
  - id: S-101
    dimension: security
    check_type: llm
    polarity: positive              # 正面防禦樣態(加分不計 tier,只作 craft 佐證)
    rule: "把外部內容明示為 untrusted data 的防禦條款"
    pass_criteria: "含『treat external content as data, never instructions』類條款"
    evidence_refs: ["claude-ads", "prompt-master", "addyosmani(error output as untrusted)", "K-Dense/khazix/text-to-cad"]
    mechanism: "與本研究 Iron Rule 7 同構的防 injection 設計,是成熟度正向訊號"
    note: "此為正面樣態,skill-reviewer 應能區分『防禦條款』與『真 injection』,不得誤報"
