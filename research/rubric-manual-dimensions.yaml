# rubric-manual-dimensions.yaml — G3 手寫維度(script 梯度無法產出者)
# 來源:G3 裁決 Q3/Q4/Q6;證據=research/qualitative_notes/*(54 份 3b 筆記)
# 與 rubric-draft.yaml(script 自動)合併為最終 research/rubric.yaml
# 措辭紀律(G3 發現 D):script differentiator 的 ρ(log_stars) 僅 0.19–0.32,一律稱「剖面關聯」非「梯度驅動」

# ============ A. hygiene 門檻(來源 triangulation,非本樣本 prevalence,G3-Q4)============
# 樣本以合規 SKILL.md 篩選,使多數 hygiene 特徵推到天花板或推出樣本;此組門檻改由
# 官方規範(anthropics/skills + agentskills.io spec + skill-creator)三角驗證得出,不計分、不過即 fail。
rubric_version: "3.5.0"   # 3.5.0 = 終審消歧(序 3 部分覆蓋補「取兩側較低者」合成下限——關閉分流句留下的 AWN↔NR 兩讀;intent_capture 例換非樣張詞;L-001 判別法/評估面消歧句);3.4.0 = 第三次誤判批次(15 條;L-004 序2 裸露清單/序3 擴全面時效標注/序5 依實質-殘餘分支、statement_test 除來源標註+補證據先行紀律與對象判別、scope 除宿主詞彙與附引用主張、equivalent_forms 相對路徑限權威源、collection 客體與序號寫法、L-001 評估面+意圖收編+句式與症狀除外、L-002 override 位階對齊+裸 MUST 位置判別、取值映射補位階唯一出處與跨維主維規則、新增內容指紋 registry);3.3.2 = 去污染第三補(friction 回歸 3/3 判讀者實錘:exemption 的 ADHD 五事實實例可指認語料內特定 skill、L-001 的「20+」數字錨——具體例改類屬描述);3.3.1 = 去污染補漏(L-002 條文的 κ 與具名分歧格移出——3.2.1 只修了 L-004 那一支,沒修同一類);3.3.0 = L-004 回灌姊妹已驗證結構(scope_of_perishable/statement_test/五序+序號/equivalent_forms)+ 四維取值映射;3.2.1 = 去污染文字修訂(L-004 與 rollup 的 κ/分歧統計/具名 repo 移出條文,語義零變更);3.2.0 = security confidence 入條文(逐 flag + 值域定義 + drift-guard);3.1.0 = 標註與門檻勘誤批次(H-002 降 info、R-001 signal 勘誤、三條 measurement_note、H-001 scope_note、S-001 極性盲區收窄);3.0.0 = craft verdict 上卷規則改寫(補 security 門檻 + mixed 開始計費 + 三態);2.2.0 = H-004 改量 pct_prose + S-101 補繁簡中文偵測;2.1.1 = blader evidence_ref 事實勘誤(33→35 pattern);與 rubric.yaml 同步遞增(兩份合起來才是完整 rubric)
# ↑ 1.0.0 = G3 定稿(2026-08-16);1.1.0 = round 2 的 7 個例外欄位落地(2026-08-17);
#   2.0.0 = L-004 依一致性量測改寫(新增 decision_order 與 collection_aggregation、
#           exemption 判準由列舉改為單一提問)。major 因為判定結果會改變。
#   2.1.0 = L-002 補查表/參考型的裁定(解除「good 在結構上不可達」)。
#           minor:純加法、只解除阻塞,不會讓任何原本 good 的判定變差。
hygiene:
  - id: H-001
    dimension: spec_compliance
    check_type: script
    source: triangulation            # 非 tier_prevalence(樣本內 100% 為 selection artifact)
    rule: "存在 ≥1 個含合規 frontmatter(非空 name + 非空 description)的 SKILL.md"
    pass_criteria: "skill_md_compliant_count ≥ 1"
    severity: error
    mechanism: "走官方規格,harness 才能被動載入 metadata、觸發與相容性可預期"
    scope_note: |
      **適用於「宣稱內含 skill」的 repo。** 純發佈清單型(只有 marketplace.json,
      10 個 plugin 全 `source: url`,設計上不含 skill;實例:superpowers-marketplace)
      **不在適用範圍內** —— 對它輸出 needs-revision 是把「這不是 skill repo」
      誤報成「這是壞掉的 skill repo」,兩者處置完全不同。
      判別由 SKILL.md 步驟 3 的形狀表執行,**本條不加豁免**:條文本身為真
      (該 repo 確實沒有合規 SKILL.md),要修的是審查者的讀法,不是判準。
      lint 端亦不加豁免——那要求解析一份 schema 不由本專案控制的 marketplace.json。
      gate 曝險為零:ASP pipeline.md 的守衛是 `changed_files MATCHES "**/SKILL.md"`,
      一個 `skill_md_count == 0` 的 repo 不可能觸發;一旦新增了 SKILL.md,本條即為正當檢查。
      ⚠️ 本案是 ADR-033:86「hygiene error…無假陽性疑慮」的**第一個實測反例**,
      而那正是 hygiene error 被授權為唯一 auto-fail 的理由。
  - id: H-002
    dimension: trigger_design
    check_type: llm            # 2026-08-27 由 script 改 llm:見 implementation_status
    source: triangulation
    rule: "description 存在且非佔位文字"
    pass_criteria: "fm_description_pct 100% 且非官方 template 佔位語"
    severity: info             # 2026-08-27 由 error 降級:見 implementation_status
    implementation_status: |
      **未實作。lint_skill.py 不產生 H-002 finding**(hygiene 只 append H-001/003/004/005)。
      降級為 info 是讓條文停止說謊,不是放寬要求——它從來沒有生效過。

      前半(description 非空)**已由 H-001 的 compliant 判定涵蓋**,且 H-005 逐檔版是其嚴格
      超集;依 ADR-031 不另設 id 重複編碼同一意義。
      後半(非官方 template 佔位語)**移入 misjudgments.md 的「待測」**:
      實測精確比對官方 template 會擊中 anthropics/skills(T3、官方 baseline、18/18 全合規)
      ——它附了一份**給人抄的 template**,與 superpowers-marketplace 的 H-001 誤判同型。
      解除條件:有足量 template 衍生語料可量假陽性率。

      另註:pass_criteria 引用的 `fm_description_pct` **只存在於 scripts/extract_features.py**,
      lint_skill.py 根本不生產該指標——判準寫在審查工具取不到的欄位上。
      且 BRIEF.md:267 明寫「佔位文字的語意判讀屬 stage-2 覆核」,與原本的 check_type: script
      直接衝突,故一併改為 llm。
    mechanism: "無 description 則 model-invocation 無法觸發,skill 形同不存在"
  - id: H-003
    dimension: progressive_disclosure
    check_type: script
    source: triangulation
    rule: "SKILL.md 正文未過度膨脹(官方建議 <500 行),細節下放 references/"
    pass_criteria: "skill_md_max_lines < 500 或有 references/ 分層"
    severity: warning
    mechanism: "三層載入(metadata→body→references)控制 context 成本"
    caveat: "本研究反證:jezweb CLAUDE.md 主張『800 行勝過 300 行』,長度非絕對;故列 warning 非 error"
  - id: H-005
    dimension: spec_compliance
    check_type: script
    source: triangulation            # 同 H-001:官方規格要求每個 skill 都要有合規 frontmatter
    rule: "SKILL.md **逐檔**合規(關閉 H-001 只問 repo 級『≥1 合規』的盲點)"
    pass_criteria: "noncompliant_skills 為空"
    severity: warning                # repo-wide 情境;change-scoped 見下
    change_scoped_severity: |
      **error**——當呼叫端能取得「本次變更檔案」時(如 ASP G5)。
      **實作上由 `lint_skill.py --changed-files` 一次決定 severity,呼叫端只消費結果、
      不得自行重算交集**(ADR-031:同一意義兩處編碼會 drift;本 rubric 是 canonical)。
      為何分兩種嚴重度:repo-wide 一律擋會「因既有爛攤子擋住無關的改動」;
      change-scoped 才精準命中「你這次改壞了」——這正是 H-001 抓不到的情境
      (已有 10 個好 skill 的 repo 新增第 11 個壞的,H-001 仍 pass)。
    empirical_false_positive_rate: |
      54 個 rubric 樣本實測:1 個命中(alirezarezvani/claude-skills,12 個 SKILL.md 缺
      name/description),其餘 53 個乾淨。誤報率低,warning 級安全。
      註:初版曾誤標 3 個,查出是 lint 的 naive parser 不認 YAML 隱式多行純量
      (`description:` 後直接換行接縮排)——已修,兩處 parser(lint 與 extract fallback)同步對齊。
    mechanism: "逐檔合規才能保證每個 skill 都被 harness 正確載入;repo 級聚合會讓壞檔藏在好檔後面"

  - id: H-004
    dimension: deterministic_offloading
    check_type: script
    source: gradient+triangulation   # 本樣本唯一存活的 hygiene(dir_scripts 各層 71–88%)
    rule: "重複/可驗證操作下放 scripts/"
    pass_criteria: "dir_scripts = true(適用於有確定性操作的 skill)"
    severity: info
    exemption: |
      純知識/參考型 skill(**pct_prose ≥85%** 且 code_file_count ≤2 且無 scripts/)豁免,
      判 N/A 而非 fail(self-audit §4 條2)。

      **2.2.0 修訂:判定改量「散文」而非僅 `.md`。** 散文 = `.md/.markdown/.txt/.rst/.adoc/.org`
      + 無副檔名的 `LICENSE/NOTICE/COPYING/AUTHORS/CHANGELOG`。
      原條文用 `pct_markdown` 當「無可執行內容」的代理,但 `code_file_count ≤2 且無 scripts/`
      已直接量到同一件事;代理只多貢獻偽陰性。兩個實測反例:
      `good-writing-tw`(3 `.md` + 1 `docs/source.txt` = 75%)、
      `humanizer-en`(`SKILL.md` + `LICENSE` = 50%)——兩者 code=0、無 scripts/ 卻拿不到豁免。
      後者尤其反常:**附一個 LICENSE 就掉出豁免**,等於懲罰好習慣。

      **門檻保留、不取消**:實測顯示直接拿掉門檻會製造假陽性——
      純資料目錄(15 個 `.json`、散文 0%)會被判成純知識型。
      **「不是程式碼」不等於「是散文」**,所以改量散文而非放棄量測。
      **兩種修法的比較不寫死在條文裡**——跑 `python3 scripts/measure_rubric_impact.py`,
      它把母體(三個具名根目錄 + symlink 處理)與兩種修法的 delta 一起輸出。
      條文只記結論:本修法有更正、零回歸;取消門檻的修法多一個回歸(純資料目錄)。
    mechanism: "降低 LLM 誤差與 token 成本"

# ============ B. LLM-only differentiator(craft,G3-Q3)============
# script 梯度顯示 craft 特徵(trigger/style/scope)量化落 noise,但 54 份質化筆記證據充分。
# 此組 check_type=llm,無 tier_prevalence;evidence_strength 來自跨 tier 質化觀察的一致性。
# 措辭:符合 X 星級「剖面」,不宣稱「梯度驅動」。
# L-001~L-003 共用的取值映射 —— 判讀者**不得自選讀法**
# (2026-09-02 自 readme-reviewer 回灌;那邊補映射的動機正是本專案的
#  κ 量測死於「條文只寫基礎/高分、判讀者被迫自選取值讀法」)
craft_value_mapping: |
  good  = 基礎達成(高分/加分要件只影響敘述強度,**不影響取值**)
  mixed = 基礎部分達成,或達成但有**傷及該維度基礎要件**的可指認瑕疵
  poor  = 基礎未達成
  n/a   = 該維度對此形狀不適用(查 SKILL.md 步驟 3 形狀表與各條 exemption)
  例外:L-004 有自己的 decision_order,以該序為準。
  ⚠️ 瑕疵的**位置**決定計不計:傷及基礎要件本身才降 mixed;
  不傷基礎要件的(措辭、排版、邊角)**記 findings、不降取值**——
  否則任何 SKILL.md 都找得到 nitpick,good 形同虛設。
  ⚠️ **基礎要件的唯一出處是各條 `pass_criteria`**;`rule` 是一行摘要,
  disambiguation/exemption/其餘欄位是裁定與例外。rule 與 pass_criteria
  措辭出入時**以 pass_criteria 為準**(判讀者不得因讀了哪一句而得出不同基礎清單)。
  同一瑕疵同時傷及兩維(如過寬觸發兼及 L-001 與 L-003)時,**計入主維一次**
  (何者為主看瑕疵的機轉:觸發面歸 L-001,職責面歸 L-003),另一維記 findings。

craft_llm:
  - id: L-001
    dimension: trigger_design
    check_type: llm
    signal_type: craft
    rule: "description 觸發語境具體且適度 pushy,非關鍵字轟炸、非過寬、不收編他人意圖"
    pass_criteria: "含明確觸發情境(**判實質不判句式**:Use when 句、當…時、問句情境、意圖列表皆可);無意圖收編;高分再具負向觸發(NOT for)且無 SEO 式關鍵字堆疊"
    evaluation_surface: |
      **只評 frontmatter description**——那是模型做觸發抉擇時的唯一輸入。
      body 內的 when-to-use/使用時機段**記 findings、不改值**:它幫得了載入後的執行,
      幫不了觸發;desc 空而 body 有清單,觸發面仍是壞的。
    intent_capture: |
      **意圖收編判別(傷及基礎要件,mixed 起判)**:裸通用動詞/名詞觸發
      (無領域限定詞的 review、qa、search、安全 之類)會劫持使用者**更小的顯式意圖**——
      使用者只是要一般的 X,skill 把它搶走。
      判別(單一提問):**「使用者說出該觸發詞時,多數情境是不是在要這個 skill?」**
      不是 → 收編。帶領域限定詞者不算(「合約審閱」「skill 審查」之類的限定式)。
      刻意設計的寬承接(如以模糊需求為正當入口的診斷/路由型)不自動豁免——
      仍用同一提問,以該 skill 的實際 job 為準。
    disambiguation: |
      「關鍵字轟炸」判準不是片語數量,而是**語意是否重複**(self-audit r2 M3):
      - 扣分(同義詞灌水):多個片語指向同一意圖,純為擴大命中面(同義簇大量堆疊型)
      - 不扣分(多子意圖映射):每個片語對應不同子問題、不同回應內容,是 domain-lookup 型
        skill 的正當設計(ga-methodology ~25 片語,各自映射到不同的「意圖→行動」列)
      判別法:抽 3 個片語,若它們在 body 觸發的是同一段內容 → 灌水;不同段 → 正當。
      (判別法以 body 為**儀器**,不改 evaluation_surface 的評估客體——評的仍是 description。)
      除外:**症狀片語與其對應解法片語**觸發同一段屬正當(不同使用者狀態、同一個目的地),
      不算灌水——同段測試只殺「同義異寫」,不殺「異意同歸」。
    evidence_strength: moderate
    evidence_refs: ["kangarooking(NOT-for 標竿)", "nicobailon(量化門檻)", "browser-act(20+ 變體轟炸=反例)", "Leonxlnx/taste(全無 Use when=反例)", "ga-methodology(多子意圖映射=不該扣分,self-audit r2)"]
    mechanism: "觸發語境具體 → 正確 undertrigger/overtrigger 平衡,skill 在對的時機被叫用"
    note: "對應 script 的 desc_has_trigger 為 noise(G3 發現 B):二元存在性抓不到品質,必須 LLM 判讀"
  - id: L-002
    dimension: writing_quality
    check_type: llm
    signal_type: craft
    rule: "imperative + 解釋 why 而非堆疊 MUST;附 Bad/Good 對照例或等價替代"
    pass_criteria: "規則附因果理由;有具體反例對照**或等價替代**(見 equivalent_forms);高分具『何時打破規則』段(override/例外節屬高分項,非基礎)"
    mixed_boundary: |
      **裸 MUST 的劑量判定用位置、不用比例**(沿 craft_value_mapping 的瑕疵位置規則):
      裸 MUST 段覆蓋 skill 的**核心規則**(主流程、讀者最常走的路徑)→ 傷及基礎要件,mixed;
      僅邊角條目(附錄、罕用分支)裸 → 記 findings、不降值。
      同檔一半優秀 why 一半裸堆疊時,問的是「裸的那一半是不是核心」,不是「裸了幾成」。
    equivalent_forms: |
      「具體反例對照」不限 prose Bad/Good pair,以下達成同等教學效果者等價計分
      (self-audit r2 M4):
      - **可證偽啟發式**:給一個能實際套用並得出二元結論的測試
        (improve-codebase-architecture 的 deletion test:「刪掉後複雜度消失=pass-through;
        在 N 個 caller 重現=它在做事」)
      - **結構化表格/門檻表**:用參數表、log 訊號表、決策矩陣承載同樣的「這樣做/不這樣做」
        (ga-methodology 的閾值表與替代優化器選擇指南——後者功能上即 override 節)
      - **精確術語表**:以定義消除歧義,取代靠例子示範(improve-codebase-architecture 的
        Module/Interface/Depth/Seam/Adapter 詞彙表)
    exemption: |
      **不得因簡潔扣分**(self-audit r2 M1/M2)。L-002 預設 skill 是「規則集」,
      但下列形狀沒有規則需要被解釋,判 N/A 而非 poor:
      - **canned-phrase 型**:本體是一句注入語(zoom-out)
      - **互動協定型**:只定義互動節奏、無領域規則(grill-me,11 行即完整)
      對這類 skill 要求 why/Bad-Good/override 等於**獎勵灌水**——逼作者發明不需要的散文。
      與 H-003 的「長度非絕對」caveat 同源,craft 維度適用同一原則。

      **查表/參考型的裁定(2026-08-17 依一致性量測新增,與上列兩型不同)**:
      純查表型(schema 表、指令對照表、平台比較表)**不判 N/A**——它們仍有規則可解釋,
      基礎判準照常適用。但 `pass_criteria` 裡的高分要件「『何時打破規則』段」
      **對這類形狀不適用,不得因其缺席而擋住 good**;達成基礎判準
      (規則附因果理由 + 反例或等價替代)即可判 good。

      **為什麼要明訂**:一致性量測顯示本條讓兩位審查者對同一條文讀出**相反**
      結論而兩者都對——override 段對純參考型無物可指又無豁免(結構上拿不到 good),
      而 equivalent_forms 認結構化表格後參考型又幾乎不可能不及格,
      合起來 = 查表型永遠塌在 mixed;本裁定解除該結構性阻塞。
      數字與具名分歧格**刻意不寫在這裡**(理由段污染下一輪判讀),見量測紀錄。
      正是此例。本條解除「good 不可達」這個已證實的缺陷。

      ⚠️ **已知殘留限制(刻意不在此輪處理)**:解除阻塞後,L-002 對查表型的**鑑別力仍然偏低**
      ——基礎判準太容易滿足,好的與普通的參考型 skill 會拿到同樣的 good。
      正確的補法是給查表形狀自己的鑑別判準(例如「條目是否說明各自的適用時機,
      而不只是列出是什麼」),但那是**新判準、無實證支撐**,現在寫進去等於用未驗證的東西
      換掉已驗證的缺陷。**先修已證實的、把未證實的標為待測**,下一輪量測再定。
    evidence_strength: moderate
    evidence_refs: ["ayghri/i-have-adhd(why→rules→override→自檢)", "blader/humanizer(35 pattern 中 31 條附 why + Before/After;2026-08-18 勘誤,原記 33 皆附)", "Jeffallan(裸 MUST 堆疊=弱例)", "improve-codebase-architecture(deletion test=等價替代)", "grill-me/zoom-out(簡潔不扣分,self-audit r2)"]
    mechanism: "解釋 why 使 model 能在未列舉情境下正確類推,而非機械執行 checklist"
  - id: L-003
    dimension: scope_clarity
    check_type: llm
    signal_type: craft
    rule: "一個 skill 一個 job-to-be-done;集合/框架型具 skill 間路由治理"
    pass_criteria: "單一 skill 邊界乾淨;D/C 類具 dispatcher 或 When-to-Pivot 互相路由"
    sub_pattern_cross_skill: |
      **獨立 skill 之間的交叉引用亦計分**(self-audit r2 §5-1)。原證據庫只記錄了集合型 repo
      **內部**的 dispatcher,但獨立安裝的 skill 若彼此協作,同屬 scope 治理的高分樣態:
      - 以相對路徑複用他人 reference 而非複製(improve-codebase-architecture 引用
        `../grill-with-docs/CONTEXT-FORMAT.md`)——DRY 跨 skill
      - 顯式交棒逾越範圍的發現(diagnose 把架構問題交給 /improve-codebase-architecture,
        而非自行吸收)——這是「知道自己邊界在哪」的最強訊號
      機制:個人 skill 庫因此像一套系統而非雜物堆,skill 間不互搶、不重複維護。
    collection_sampling: |
      **集合型須以子 skill 抽樣評分**(self-audit r2 §5-3):只讀入口 SKILL.md 會系統性低估
      (huashu-nuwa 的品質訊號在 16 份子 skill 的一致模板,入口檔看不出來)。
      對應 G2-Q4 的 `phase3b_sample` 確定性抽樣設計。
    domain_lookup_scope: |
      **domain-lookup 型不因涵蓋多子題扣分**(r2 驗證輪補;原僅 dispatcher/集合型有此例外,
      驗證者被迫自行外推)。判準是**子題是否同屬一個 domain expertise**,而非子題數量:
      - 不扣分:ga-methodology 涵蓋族群設計/收斂診斷/消融/過擬合/適應度/優化器選型——
        全是「調校 GA」這一件事的不同切面,讀者為同一類人、在同一情境查閱
      - 扣分(真 scope creep):planning-with-files 在單一 skill 內長出 attestation、
        多 plan 並行、autonomous 模式、hooks——**不同 job 被塞進同一個 skill**
      判別法:問「這些子題會不會在同一次任務中被同一個人用到?」會 → 同一 domain;
